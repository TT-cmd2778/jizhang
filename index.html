<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="饭账">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F4">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>饭账</title>
<style>
:root{--bg:#EEF1F4;--card:#fff;--ink:#1D2733;--mut:#6B7785;--line:#DCE2E8;--b:#E0992B;--l:#2F8A7A;--d:#5A5FC4;--o:#B8546A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12171D;--card:#1B222B;--ink:#E6EBF0;--mut:#8D99A6;--line:#2A333E;--b:#F0B04A;--l:#4DB3A1;--d:#8087E8;--o:#E27C92}}
:root[data-theme=dark]{--bg:#12171D;--card:#1B222B;--ink:#E6EBF0;--mut:#8D99A6;--line:#2A333E;--b:#F0B04A;--l:#4DB3A1;--d:#8087E8;--o:#E27C92}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:14px 16px 40px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.nav{display:flex;align-items:center;gap:6px}
.nav .t{flex:1;min-width:0}
.nav h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.5px}
.nav small{color:var(--mut);font-size:14px}
.ib{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:20px}
.tb{height:42px;padding:0 14px;border-radius:21px;background:var(--card);border:1px solid var(--line);font-size:14px}
.sum{margin:16px 0 18px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.sum .n{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums}
.sum .lab{color:var(--mut);font-size:14px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin-top:12px}
.bar i{display:block;height:100%}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.sh{display:flex;align-items:center;padding:12px 14px 12px 0}
.sh::before{content:"";width:5px;height:22px;border-radius:0 3px 3px 0;background:var(--c);margin-right:12px}
.sh b{flex:1;font-size:17px}
.sh span{color:var(--mut);margin-right:10px;font-variant-numeric:tabular-nums}
.add{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;font-size:22px;line-height:1}
.row{display:flex;align-items:center;padding:10px 8px 10px 17px;border-top:1px solid var(--line)}
.row .nt{flex:1;min-width:0;overflow-wrap:anywhere}
.row .nt.e{color:var(--mut)}
.row .am{font-variant-numeric:tabular-nums;margin:0 4px 0 10px}
.row .x{width:34px;height:34px;color:var(--mut);font-size:18px}
.mcard .mh{display:flex;justify-content:space-between;align-items:baseline;color:var(--mut);font-size:14px}.mcard .mh b{color:var(--ink);font-size:16px}.mcard .sp{display:flex;gap:6px 14px;margin-top:12px;flex-wrap:wrap;color:var(--mut);font-size:14px}.mcard .sp span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px}
.mo b{color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums}
.mo .sp{display:flex;justify-content:center;gap:14px;margin-top:6px;flex-wrap:wrap}
.mo .sp span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px}
.bk{display:flex;gap:10px;margin-top:6px}.bk button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:9}
#ov.on{display:flex}
#sheet{width:100%;max-width:520px;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chip{flex:1;height:40px;border-radius:20px;border:1.5px solid var(--line);font-size:15px}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
#sheet input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px;font-size:17px;margin-bottom:10px}
#amt{font-size:26px!important;font-weight:700;font-variant-numeric:tabular-nums}
.ok{width:100%;height:50px;border-radius:12px;background:var(--ink);color:var(--card);font-weight:700;font-size:17px;margin-top:2px}
.err{color:var(--o);font-size:14px;min-height:20px;margin:0 0 4px}
</style>
</head>
<body>
<main id="app"></main>
<div id="ov" data-a="close"><div id="sheet"></div></div>
<script>
const K='fanzhang.v1';
let S={e:[]};
try{S=JSON.parse(localStorage.getItem(K))||S}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const C=[['b','早餐'],['l','午餐'],['d','晚餐'],['o','其他']];
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const money=n=>'$'+n.toFixed(2);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=ds(new Date()),sc='b';
const $=id=>document.getElementById(id);

function render(){
  const d=parse(cur),isT=cur===ds(new Date());
  const day=S.e.filter(x=>x.date===cur);
  const sum=(k,a)=>a.filter(x=>x.cat===k).reduce((s,x)=>s+x.amt,0);
  const tot=day.reduce((s,x)=>s+x.amt,0);
  const tm=ds(new Date()).slice(0,7),mo=S.e.filter(x=>x.date.slice(0,7)===tm),nd=new Set(mo.map(x=>x.date)).size;
  const mt=mo.reduce((s,x)=>s+x.amt,0);
  let h=`<div class="nav"><button class="ib" data-a="prev">‹</button>
  <div class="t"><h1>${d.getMonth()+1}月${d.getDate()}日</h1><small>周${'日一二三四五六'[d.getDay()]}${isT?'（今天）':''}</small></div>
  ${isT?'':'<button class="tb" data-a="today">回到今天</button>'}
  <button class="ib" data-a="next">›</button></div>
  <div class="sum"><div class="lab">当天合计</div><div class="n">${money(tot)}</div>
  <div class="bar">${C.map(([k])=>{const v=sum(k,day);return v?`<i style="width:${v/tot*100}%;background:var(--${k})"></i>`:''}).join('')}</div></div>
  <div class="sum mcard"><div class="mh"><b>本月目前开销</b><span>${+tm.slice(5)}月 · 已记 ${nd} 天</span></div><div class="n">${money(mt)}</div><div class="lab">日均 ${money(nd?mt/nd:0)}</div>
  <div class="bar">${C.map(([k])=>{const v=sum(k,mo);return v?`<i style="width:${v/mt*100}%;background:var(--${k})"></i>`:''}).join('')}</div>
  <div class="sp">${C.map(([k,n])=>`<span style="--c:var(--${k})">${n} ${money(sum(k,mo))}</span>`).join('')}</div></div>`;
  C.forEach(([k,n])=>{
    const es=day.filter(x=>x.cat===k);
    h+=`<section class="sec" style="--c:var(--${k})"><div class="sh"><b>${n}</b><span>${es.length?money(sum(k,day)):''}</span><button class="add" data-a="add" data-k="${k}" aria-label="添加${n}">+</button></div>`;
    es.forEach(x=>{h+=`<div class="row"><div class="nt${x.note?'':' e'}">${x.note?esc(x.note):'未备注'}</div><div class="am">${money(x.amt)}</div><button class="x" data-a="del" data-id="${x.id}" aria-label="删除">✕</button></div>`});
    h+='</section>';
  });
  h+='<div class="bk"><button data-a="exp">复制备份</button><button data-a="imp">粘贴恢复</button></div><p style="color:var(--mut);font-size:13px;text-align:center">共 '+S.e.length+' 条记录，建议每周备份一次</p>';
  $('app').innerHTML=h;
}

function sheet(){
  const keep=$('sheet').querySelector('#amt');
  const a=keep?keep.value:'',n=$('sheet').querySelector('#note')?$('sheet').querySelector('#note').value:'';
  $('sheet').innerHTML=`<div class="chips">${C.map(([k,t])=>`<button class="chip${k===sc?' on':''}" style="--c:var(--${k})" data-a="pick" data-k="${k}">${t}</button>`).join('')}</div>
  <input id="amt" inputmode="decimal" placeholder="金额 $" autocomplete="off" value="${esc(a)}">
  <input id="note" placeholder="${sc==='o'?'备注，如：咖啡、地铁卡':'备注（可不填），如：Chipotle'}" autocomplete="off" value="${esc(n)}">
  <p class="err" id="err"></p><button class="ok" data-a="save">保存</button>`;
}
function open(k){sc=k;$('sheet').innerHTML='';sheet();$('ov').classList.add('on');setTimeout(()=>$('amt').focus(),60)}
function close(){$('ov').classList.remove('on')}
function bk(m){
  const ex=m==='exp';
  $('sheet').innerHTML=`<p style="margin:0 0 10px;font-weight:700">${ex?'备份：复制下面全部内容，粘贴到备忘录保存':'恢复：把备份内容粘贴到下面'}</p><textarea id="bt" ${ex?'readonly':''} placeholder="粘贴备份内容" style="width:100%;height:140px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font-size:14px;resize:none"></textarea><p class="err" id="err"></p><button class="ok" data-a="${ex?'cp':'rs'}">${ex?'复制备份':'恢复记录'}</button>`;
  if(ex)$('bt').value='FZ1:'+JSON.stringify(S.e);
  $('ov').classList.add('on');
}
function cp(){
  const t=$('bt');t.select();t.setSelectionRange(0,1e9);
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}
  const f=()=>{$('err').style.color='var(--l)';$('err').textContent='已复制，去备忘录粘贴保存'};
  const no=()=>{$('err').textContent='自动复制失败，请长按文字手动复制'};
  if(ok)f();else if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(f,no);else no();
}
function rs(){
  try{
    const t=$('bt').value.trim();
    if(t.slice(0,4)!=='FZ1:')throw 0;
    const a=JSON.parse(t.slice(4));
    const have=new Set(S.e.map(x=>x.id));
    const nw=a.filter(x=>x&&x.id&&x.date&&'bldo'.includes(x.cat)&&x.amt>0&&!have.has(x.id));
    S.e=S.e.concat(nw);save();close();render();
    alert('已恢复 '+nw.length+' 条记录');
  }catch(e){$('err').textContent='内容格式不对，请粘贴完整的备份文本'}
}
function commit(){if(!$('amt'))return;
  const a=parseFloat($('amt').value.replace(',','.')),n=$('note').value.trim();
  if(!(a>0)){$('err').textContent='请输入大于 0 的金额';return}
  if(sc==='o'&&!n){$('err').textContent='“其他”需要写一个备注';return}
  S.e.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),date:cur,cat:sc,amt:Math.round(a*100)/100,note:n});
  save();close();render();
}
const shift=n=>{const d=parse(cur);d.setDate(d.getDate()+n);cur=ds(d);render()};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  if(t.id==='ov'&&e.target!==t)return;
  const a=t.dataset.a;
  if(a==='prev')shift(-1);else if(a==='next')shift(1);
  else if(a==='today'){cur=ds(new Date());render()}
  else if(a==='add')open(t.dataset.k);
  else if(a==='pick'){sc=t.dataset.k;sheet()}
  else if(a==='save')commit();
  else if(a==='close')close();
  else if(a==='exp'||a==='imp')bk(a);
  else if(a==='cp')cp();
  else if(a==='rs')rs();
  else if(a==='del'){if(confirm('删除这条记录？')){S.e=S.e.filter(x=>x.id!==t.dataset.id);save();render()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('ov').classList.contains('on'))commit()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('ov').classList.contains('on')){render()}});
render();
</script>
</body>
</html>
